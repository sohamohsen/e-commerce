spring.application.name=ecommerce
server.servlet.context-path=/api


# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/e_commerce?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT / security
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}

# Paymob
paymob.api-key=${PAYMOB_API_KEY}
paymob.secret-key=${PAYMOB_SECRET_KEY}
paymob.public-key=${PAYMOB_PUBLIC_KEY}
paymob.hmac=${PAYMOB_HMAC}
paymob.integration-id=5781837
paymob.notification-url=${PAYMOB_NOTIFICATION_URL}
paymob.redirection-url=${PAYMOB_REDIRECTION_URL}

# Comma-separated frontend origins. Set this to your frontend ngrok URL in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://a079-41-45-37-133.ngrok-free.app/:http://localhost:8080}

# Rabbit mq
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USERNAME}
spring.rabbitmq.password=${RABBIT_PASSWORD}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# AWS S3
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket-name=${AWS_S3_BUCKET}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
server.port=8080

# Swagger / OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Huggingface
huggingface.api-key=${HUGGINGFACE_API_KEY}
huggingface.model=meta-llama/Llama-3.1-8B-Instruct
huggingface.base-url=https://router.huggingface.co/v1
