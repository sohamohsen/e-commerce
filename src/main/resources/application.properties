spring.application.name=ecommerce
server.servlet.context-path=/api


# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/e_commerce?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT / security
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}

# Paymob
paymob.api-key=${PAYMOB_API_KEY}
paymob.secret-key=${PAYMOB_SECRET_KEY}
paymob.public-key=${PAYMOB_PUBLIC_KEY}
paymob.hmac=${PAYMOB_HMAC}
paymob.integration-id=5781837
paymob.notification-url=${PAYMOB_NOTIFICATION_URL}
paymob.redirection-url=${PAYMOB_REDIRECTION_URL}

# Rabbit mq
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USERNAME}
spring.rabbitmq.password=${RABBIT_PASSWORD}


server.port=8080
